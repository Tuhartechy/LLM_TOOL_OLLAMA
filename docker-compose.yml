services:
  ollama:
    image: ollama/ollama:0.4.1
    container_name: ollama_service
    restart: always
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    networks:
      - app_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_service
    restart: always
    volumes:
      - app_data:/app/data
    environment:
      - ACCESS_CODE=${ACCESS_CODE:-}
      - OLLAMA_BASE_URL=http://ollama:11434
      - DATABASE_URL=sqlite+aiosqlite:///./data/ollama_tool.db
      - ALLOWED_ORIGINS=*
      - RATE_LIMIT_PER_MINUTE=30
    depends_on:
      - ollama
    networks:
      - app_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_service
    restart: always
    depends_on:
      - backend
    networks:
      - app_net

  proxy:
    image: caddy:2.8.4-alpine
    container_name: proxy_service
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - app_net

  model_puller:
    image: curlimages/curl:8.10.1
    container_name: model_puller_service
    restart: "no"
    volumes:
      - ./deploy/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      - ollama
    networks:
      - app_net

volumes:
  ollama_models:
  app_data:
  caddy_data:
  caddy_config:

networks:
  app_net:
    driver: bridge
